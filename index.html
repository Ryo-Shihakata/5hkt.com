<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5HKT — Portfolio</title>
  <meta name="description" content="個人ポートフォリオ — 作成Webアプリ / 自宅サーバー / 連絡先">
  <meta name="color-scheme" content="light dark">
  <!-- 旧デザインを選んだ人は /classic/ へ（選択は js/style-pref.js が保存） -->
  <script>document.documentElement.classList.add('js');try{if(localStorage.getItem('pf_style')==='classic')location.replace('classic/'+location.hash)}catch(e){}</script>
  <link rel="icon" href="assets/icon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="site-header">
    <div class="wrap header-inner">
      <a href="./" class="brand" aria-label="5HKT">
        <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">5HKT</span>
      </a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="header-tools">
        <button class="pill-btn" id="lang" type="button"></button>
        <a class="pill-btn" id="style-switch" href="classic/" data-style-switch="classic"></a>
      </div>
    </div>
  </header>

  <main id="top">

    <!-- HERO -->
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <h1 class="hero-title" id="hero-title"></h1>
          <p class="hero-role hero-in" style="--d:2" id="hero-role"></p>
          <p class="hero-lead hero-in" style="--d:3" id="hero-lead"></p>
          <div class="hero-actions hero-in" style="--d:4" id="hero-actions"></div>
          <dl class="facts hero-in" style="--d:5" id="facts"></dl>
        </div>
        <figure class="hero-art" id="hero-art" aria-hidden="true"></figure>
      </div>
    </section>

    <!-- WORKS（PICK UP の抜粋） -->
    <section class="section" id="works">
      <div class="wrap">
        <div class="section-head reveal">
          <h2 class="section-title" id="works-title"></h2>
          <p class="section-lead" id="works-lead"></p>
        </div>
        <div class="card-grid" id="works-grid"></div>
        <div class="section-foot reveal">
          <a class="text-link" href="works/" id="works-all"></a>
        </div>
      </div>
    </section>

    <!-- HOMELAB -->
    <section class="section section-alt" id="homelab" hidden>
      <div class="wrap">
        <div class="section-head reveal">
          <h2 class="section-title" id="lab-title"></h2>
          <p class="section-lead" id="lab-lead"></p>
        </div>
        <div class="lab-grid" id="lab-grid"></div>
        <ul class="tag-row reveal" id="lab-tags"></ul>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section" id="contact">
      <div class="wrap contact-grid">
        <div class="reveal">
          <h2 class="section-title section-title-lg" id="contact-title"></h2>
        </div>
        <ul class="contact-list" id="contact-list"></ul>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-brand">5HKT</p>
      <p class="footer-note" id="footer-note"></p>
      <p class="footer-meta">
        <a href="classic/" data-style-switch="classic" id="footer-style"></a>
        <span id="footer-copy"></span>
      </p>
    </div>
  </footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
